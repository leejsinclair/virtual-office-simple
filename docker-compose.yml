version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: virtual-office-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped
    networks:
      - virtual-office-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: virtual-office-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - virtual-office-network

networks:
  virtual-office-network:
    driver: bridge

